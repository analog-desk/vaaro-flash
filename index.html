/60,shutterSpeeds:z1,longestTimedS:2,apertureStops:[3.5,4,4.5,5.6,8,11,16,22],ttl:!1,hss:!1,rearCurtain:!1,stabilisationStopsUsed:0,lenses:[_1],focusAid:"Manual focus: split-image / microprism screen. Line up the split image on an eye or an edge.",flashNotes:["Normal X-sync is 1/60 s. Faster speeds give a partly black frame because the shutter curtain covers part of the film during the flash.","The iT32 fires from the centre contact only. No TTL and no automatic shutter setting, so set everything yourself.",'Use Manual mode (aperture ring off "A") so the camera does not change the aperture. A manual flash calculation only holds at the aperture you chose.',"Rear-curtain sync and high-speed sync are not available."],sourceNotes:["Canon AE-1 Program instruction manual: 2 s – 1/1000 s plus B, X-sync 1/60 s, film-speed dial ASA 12–3200."]},xt5:{id:"xt5",name:"Fujifilm X-T5",shortName:"X-T5",medium:"digital",format:"APS-C digital (1.5× crop)",cropFactor:1.5,cocMm:.02,flashSyncS:1/250,shutterSpeeds:$1,longestTimedS:30,apertureStops:q1,isoRange:{min:125,max:12800,extendedMin:64,extendedMax:51200,stops:H1},ttl:!0,hss:!0,rearCurtain:!0,stabilisationStopsUsed:3,lenses:[R1],focusAid:"Autofocus: AF-S with face/eye detection for people, single point for products, AF-C for moving subjects.",flashNotes:["Flash sync is 1/250 s with the mechanical shutter. Use the mechanical shutter (MS) for flash. Fujifilm listings disagree on flash with the electronic shutter, so do not rely on it.","TTL, HSS and rear-curtain sync need the iT32 fitted with the Fujifilm X5-F module (or another Godox Fuji-protocol trigger) and current firmware on both.","HSS output above 1/250 s is much lower than normal output and Godox does not publish an HSS guide number, so the app does not calculate HSS power."],sourceNotes:["Fujifilm X-T5 specifications: flash sync 1/250 s (mechanical shutter), ISO 125–12800 (extended 64–51200), mechanical shutter up to 1/8000 s.","The app assumes only 3 of the X-T5's rated in-body stabilisation stops. Stabilisation steadies the camera, not the subject."]}};function om(i,r){return i.maxApertureAtMin===i.maxApertureAtMax?{value:i.maxApertureAtMin,documented:!0}:r<=i.focalMin?{value:i.maxApertureAtMin,documented:!0}:r>=i.focalMax?{value:i.maxApertureAtMax,documented:!0}:{value:i.maxApertureAtMax,documented:!1}}function Gh(i,r){return Math.min(i.focalMax,Math.max(i.focalMin,r))}const ke={ratedGnM:18,gnReferenceIso:100,gnNotes:"Godox rates the iT32 at GN 18 (metres, ISO 100, full power). The head does not zoom, so the rating applies at its one fixed coverage. Godox does not publish the beam angle.",measuredGnM:{value:11.5},coverageNote:"Fixed head with no zoom. Coverage is not published by Godox; one reviewer estimates the beam is roughly equivalent to a 28mm lens on full frame. If that holds, it covers 35–70mm on the AE-1 and the XF 23mm on the X-T5 (35mm equivalent).",powerStepsPerStop:3,minPowerStops:-7,tiltDeg:{min:0,max:90},rotateDeg:270},G1=[1,1/2,1/4,1/8,1/16,1/32,1/64,1/128],ln={bare:{id:"bare",label:"Bare head",lossStops:0,note:"No loss. Smallest, hardest light."},diffuser:{id:"diffuser",label:"Clip-on diffuser",lossStops:1,note:"Typical loss ≈ 1 stop (estimate; varies by product). It softens shadow edges only slightly, because the light source is still small."},softbox:{id:"softbox",label:"Small softbox / umbrella",lossStops:1.7,note:"Typical loss 1.5–2 stops (estimate). Much softer light, but only when it is close to the subject."}},Lh=1.3,El={portrait:{id:"portrait",label:"Portrait",short:"People, faces, headshots",noun:"subject",aperture:{pref:4,widest:1.4,narrowest:8},dofIntent:"Shallow enough to soften the background, deep enough to keep both eyes sharp.",distanceM:2,bgDistanceM:3,focalFF:70,motionLimitS:1/60,tripodFriendly:!1,flashAffinity:"high",preferredFlash:"bounce",focus:{film:"Focus on the nearest eye with the split-image circle, then recompose slightly. At f/4 and 2 m you have about ±15 cm of sharpness.",digital:"AF-S with eye detection on. Let the camera track the nearest eye."},composition:"A short-telephoto view (70mm on the AE-1) flatters faces and compresses the background. Leave space in the direction the subject looks.",lightDirection:"Light from 30–45° to one side and slightly above eye level gives shape. Straight-on flash flattens the face.",separation:"Move the subject 2–3 m away from the background. The background gets darker with flash and softer with wide apertures.",mistakes:["Direct on-axis flash close to the lens gives red-eye, a flat face and a hard shadow on the wall behind.","Standing your subject against a wall puts the flash shadow right behind them. Pull them forward.","Exposing for a bright sky behind a person leaves the face dark on film.","Shooting below about 1/60 s handheld at 70mm without flash gives soft eyes."],guidance:["Starting apertures: f/4–f/5.6 on the FD 35–70 (f/3.5 only at 35mm). Close-ups at 70mm need f/5.6 for both eyes.","On the X-T5 with the XF 23mm f/2.8: f/2.8–f/4. The 35mm-equivalent view keeps more background, so separation comes from distance and light more than blur.","Distance: 1.5–3 m. Further than that and the iT32 runs out of power quickly at f/5.6.","Bounced flash off a low white ceiling gives soft, flattering light indoors. Direct flash is for a deliberate snapshot look.","To avoid harsh facial shadows, bounce, or keep direct flash as a weak fill (−1 to −2 stops) under ambient light.","Skin tones: colour negative stocks like Portra are designed for skin. Give them full exposure, because underexposure turns skin muddy and grainy."]},street:{id:"street",label:"Street",short:"Candid, people in places",noun:"subject",aperture:{pref:8,widest:2.8,narrowest:16},dofIntent:"Deep zone focus so you can shoot without focusing each frame.",distanceM:2.5,bgDistanceM:6,focalFF:35,motionLimitS:1/125,tripodFriendly:!1,flashAffinity:"medium",preferredFlash:"direct",focus:{film:'Zone focus: pre-set the focus distance and shoot inside the zone shown under "Focus". Use the hyperfocal guidance.',digital:"Zone focus in manual, or AF-C with wide tracking for moving people."},composition:"Work at 35mm, get close (2–3 m), and use foreground layers. Wait for the gesture.",lightDirection:"Side or back light makes texture and long shadows. At night, the flash is the light and the street lights become the background.",separation:"Use light: put people against a shaded or darker background, or let flash pop them off a dark street.",mistakes:["A shutter speed that is too slow blurs walking people (below about 1/125 s without flash).","At night, flash with a fast shutter gives a black background, so drag the shutter to keep the city lights.","Flash too close at too much power burns out faces in the foreground. Power for the nearest person."],guidance:["Environmental exposure: meter for the scene, not for a bright sky.","Balance ambient and flash: let the shutter set the background and the flash set the subject.","Shutter: 1/125–1/250 s freezes walkers in daylight. 1/15–1/30 s plus flash gives sharp subjects with light trails at night.","Flash distance: decide your shooting distance (2–3 m) and set the power for that distance. Keep that distance as you shoot.","Avoid overexposed foregrounds: anything at half the distance gets 4× the light (2 stops brighter)."]},fashion:{id:"fashion",label:"Fashion",short:"Editorial, styled looks",noun:"model",aperture:{pref:5.6,widest:2.8,narrowest:11},dofIntent:"Whole outfit sharp, background softened.",distanceM:3,bgDistanceM:3,focalFF:50,motionLimitS:1/125,tripodFriendly:!1,flashAffinity:"high",preferredFlash:"offcamera",focus:{film:"Focus on the eyes. At 3 m and f/5.6 you have roughly a metre of depth, so full-length is easy.",digital:"AF-C with eye detection for movement and posing."},composition:"Full-length at 35–50mm from a low angle elongates the figure. Leave negative space for editorial layouts.",lightDirection:"Hard light from 45–90° to the side makes graphic shadows. On-camera direct flash gives the paparazzi / editorial snapshot look.",separation:"Underexpose the ambient background 1–2 stops so the flash-lit model stands out.",mistakes:["Mixing hard and soft light without intent muddies the look. Choose one.","Shooting faster than the sync speed with flash gives black bands at the edge of the frame.",'Underexposing the subject on colour negative film to look "moody" gives grain and colour shifts. Darken the background instead.'],guidance:["Dramatic flash: bare head, off to one side, ambient pulled 1–2 stops down.","Hard light shows texture and fabric; soft light flatters skin. Pick one per look.","Side lighting at 90° splits the face, which is dramatic. 45° gives a classic shape.","Intentional overexposure (bright, washed out) works on colour negative film. Intentional underexposure works only on the background, not on the subject."]},product:{id:"product",label:"Product",short:"Objects, still life",noun:"product",aperture:{pref:11,widest:4,narrowest:16},dofIntent:"Front-to-back sharp product.",distanceM:1,bgDistanceM:.8,focalFF:70,motionLimitS:null,tripodFriendly:!0,flashAffinity:"high",preferredFlash:"offcamera",focus:{film:"On a tripod, focus a third of the way into the product. Check the depth of field shown.",digital:"Single-point AF on the label or front edge. Magnify in live view to confirm."},composition:"Use the long end to avoid distortion. Clean background, deliberate angle.",lightDirection:"Light from the side or behind shows texture. Glossy products need a large soft source placed where its reflection is wanted.",separation:"Keep the product 0.5–1 m from the background so you can light or darken the background separately.",mistakes:["Direct on-camera flash puts a hot specular spot on glossy surfaces.","Shooting wide open leaves the back of the product soft.","Highlights on white products clip easily on slide film; control them with diffusion and distance."],guidance:["Reflections: a reflection shows the light source itself. Move the light, not the camera, to place it.","Surface texture: low, raking light across the surface.","Diffusion: the bigger the source relative to the product, the softer the highlight.","Background exposure: move the product further from the background to darken it with flash, or closer to keep it light."]},landscape:{id:"landscape",label:"Landscape",short:"Scenery, wide views",noun:"foreground subject",aperture:{pref:11,widest:5.6,narrowest:16},dofIntent:"Everything sharp from near to far.",distanceM:5,bgDistanceM:50,focalFF:35,motionLimitS:null,tripodFriendly:!0,flashAffinity:"low",preferredFlash:"direct",focus:{film:'Use the hyperfocal distance shown under "Focus" so everything from half that distance to infinity is acceptably sharp.',digital:"Focus about a third into the scene, or use the hyperfocal distance shown."},composition:"Strong foreground, a clear subject, and the horizon off-centre.",lightDirection:"Low side light (golden hour) shows the shape of the land. Flat midday light rarely flatters landscapes.",separation:"Use atmospheric depth: darker foreground, lighter distance.",mistakes:["Flash does nothing for a distant landscape. The iT32 only reaches a short distance.","Metering a bright sky makes the land too dark. Meter the land, or average.","Handholding slow speeds at dusk. Use a tripod and a cable release."],guidance:["Ambient light comes first. Flash only helps a close foreground object.","Fill flash can light a nearby rock or flower against the sunset. Calculate it for that distance only.","Balancing flash and natural light: expose the sky first, then add flash power for the foreground at its distance."]},food:{id:"food",label:"Food",short:"Dishes, drinks, table",noun:"dish",aperture:{pref:5.6,widest:2.8,narrowest:11},dofIntent:"Hero part of the dish sharp, background falling off.",distanceM:.8,bgDistanceM:.6,focalFF:70,motionLimitS:null,tripodFriendly:!0,flashAffinity:"medium",preferredFlash:"bounce",focus:{film:"Close focus limit is 0.5 m on the FD 35–70. Focus on the front edge of the hero item.",digital:"Single-point AF on the hero detail."},composition:"Overhead for flat dishes, 30–45° for drinks and stacked food.",lightDirection:"Back or side light (like a window behind the table) shows texture and makes sauces and glass glow.",separation:"Use shallow depth of field and a darker or simpler background.",mistakes:["Direct on-camera flash flattens food and makes greasy hotspots.","Mixing warm room light with window light gives orange and blue patches.","Too much depth of field makes the background clutter compete."],guidance:["Texture comes from side or back light.","Colour accuracy: choose one light colour. Switch off warm room lights near a window.","Reflections on cutlery and glazes show the light source; diffuse or move it.","Soft directional lighting: bounce the flash off a wall to one side to mimic a window."]},architecture:{id:"architecture",label:"Architecture",short:"Buildings, interiors",noun:"subject",aperture:{pref:11,widest:5.6,narrowest:16},dofIntent:"Everything sharp; straight lines.",distanceM:4,bgDistanceM:5,focalFF:35,motionLimitS:null,tripodFriendly:!0,flashAffinity:"low",preferredFlash:"bounce",focus:{film:"Focus at the hyperfocal distance shown for front-to-back sharpness.",digital:"Focus a third into the room; turn on the electronic level."},composition:"Keep the camera level so verticals stay vertical. Use 35mm and step back.",lightDirection:"Side light across facades shows texture. Inside, the window is the main light.",separation:"Shape the space with light falling off from the windows.",mistakes:["One small speedlight cannot light a room evenly. It lights the front and leaves the back dark.","Tilting the camera up converges verticals.","Exposing for the windows makes the room black. Exposing for the room blows out the windows."],guidance:["Ambient exposure first: on a tripod, use a long exposure.","Window light: let windows go about 1–2 stops brighter than the room on negative film.","Mixed colour temperatures (tungsten + daylight) show as orange vs blue. Turn lights off or embrace it.","Flash fill: bounce off the ceiling behind you to lift the near room by a stop. Do not try to light the whole room."]},macro:{id:"macro",label:"Macro / close-up",short:"Small details",noun:"subject",aperture:{pref:11,widest:5.6,narrowest:16},dofIntent:"Depth of field is tiny up close; stop down.",distanceM:.5,bgDistanceM:.3,focalFF:70,motionLimitS:1/125,tripodFriendly:!0,flashAffinity:"high",preferredFlash:"direct",focus:{film:"Set the lens to its 0.5 m minimum at 70mm and rock your body to focus. That gives 0.15× magnification at most.",digital:"Manual focus with focus peaking and magnification, or rock the camera."},composition:"Simple backgrounds. Get parallel to the subject plane to make the most of the shallow depth.",lightDirection:"Light from above and to the side. Tilt the iT32 head down slightly so the light hits the close subject instead of passing over it.",separation:"Flash falls off fast at close range, so the background goes dark naturally.",mistakes:["At 0.5 m a flash pointed straight ahead can overshoot the subject (parallax). Angle it down or hold it off-camera.","Too much power: the iT32 at 0.5 m needs very little output.","Wide apertures at close range leave almost nothing sharp."],guidance:["Very short flash distances need very low power. The app calculates it.","Diffusion matters even more up close: a diffuser makes the source larger relative to a small subject.","Depth of field: at 0.5 m, f/11 gives only about 1–2 cm on 35mm.","Focus accuracy: move yourself, not the focus ring."]},automotive:{id:"automotive",label:"Automotive",short:"Cars, bikes, vehicles",noun:"vehicle",aperture:{pref:8,widest:4,narrowest:16},dofIntent:"Whole vehicle sharp.",distanceM:5,bgDistanceM:10,focalFF:50,motionLimitS:null,tripodFriendly:!0,flashAffinity:"low",preferredFlash:"offcamera",focus:{film:"Focus on the nearest headlight or badge, then check the depth of field.",digital:"Single-point AF on the front wheel or headlight."},composition:"Three-quarter front view, low camera, 50mm or longer to avoid distortion.",lightDirection:"Large soft light (overcast sky, open shade, dusk) shapes paint best. Hard sun creates hot spots.",separation:"Shoot in a clean location with space behind the car.",mistakes:["A small flash on a whole car gives one hot spot and a dark rest. It is good only for details or light painting.","Paint reflections show everything; check what the car is reflecting.","Midday sun gives harsh reflections on curved panels."],guidance:["Reflections: the paint is a curved mirror, so you light the reflection, not the paint.","Paint highlights: use a large, soft, distant source such as the sky at dusk.","Directional light: side light shows body lines.","Ambient vs flash: let ambient light do the car and use the flash for wheels, badges or interior details at close range."]},nightlife:{id:"nightlife",label:"Nightlife / events",short:"Parties, gigs, bars",noun:"subject",aperture:{pref:5.6,widest:2,narrowest:8},dofIntent:"Enough depth for groups and moving people.",distanceM:2,bgDistanceM:4,focalFF:35,motionLimitS:1/60,tripodFriendly:!1,flashAffinity:"high",preferredFlash:"direct",focus:{film:"Pre-focus at 2 m (zone focus) and keep that distance. Focusing in the dark is hard on a split-image screen.",digital:"AF-S with face detection; turn on the AF-assist lamp if allowed."},composition:"Get close, 35mm, include the light sources and crowd for atmosphere.",lightDirection:"Direct flash for the classic party look; bounce if the ceiling is low and white.",separation:"A slow shutter lets coloured stage and bar lights fill the background.",mistakes:["Flash at 1/60 s in a dark venue gives a black background and loses the atmosphere.","Very slow shutters handheld give ghosting around the flash-frozen subject. Use it on purpose, or stay at 1/15–1/30 s.","Not resetting power when you change distance. Every doubling of distance needs 2 stops more power."],guidance:["Direct flash gives the raw, high-contrast party look.","Slow sync: 1/8–1/30 s keeps the venue lights while the flash freezes the subject.","Motion blur: twisting or panning during a slow-sync exposure gives light trails.","Background exposure is set by the shutter speed alone; subject exposure by the flash."]},other:{id:"other",label:"Other",short:"General scene",noun:"subject",aperture:{pref:5.6,widest:2.8,narrowest:16},dofIntent:"Moderate depth of field.",distanceM:2.5,bgDistanceM:4,focalFF:50,motionLimitS:1/60,tripodFriendly:!1,flashAffinity:"medium",preferredFlash:"bounce",focus:{film:"Focus on the most important element with the split-image circle.",digital:"Single-point AF on the main subject."},composition:"Decide the main subject first, then simplify everything around it.",lightDirection:"Look for light coming from the side.",separation:"Separate the subject from the background with distance, light or focus.",mistakes:["Metering a frame dominated by sky or a bright window.","Using a shutter speed too slow to hold steady."],guidance:["Start from the recommendation and adjust by what you see in the scene."]}},Et={sunny:{id:"sunny",label:"Sunny",short:"Direct sun",subjectEv:15,backgroundEv:15,evRange:[14,16],kelvin:"≈5500 K",outdoors:!0,flashRole:"fill",meaning:'Very bright with hard shadows. "Sunny 16": f/16 at 1/ISO seconds is a correct exposure.',flashAdvice:"Flash is only a fill for shadows under eyes and hats. On the AE-1 the 1/60 s sync limit means ISO 100 film already needs about f/22, and faster film overexposes unless you add an ND filter. At f/22 the iT32 only reaches about 1 m as fill. Turning your subject or using a reflector is usually better.",balance:"Expose for the sunlit scene; set the flash 1–2 stops below that to open shadows.",mistakes:["Faces squinting into the sun. Turn the subject so the sun is behind or to the side.","Fast film (ISO 800) in sun: the AE-1 needs about f/16 at 1/1000 s, so shallow depth of field is impossible without an ND filter.","Using flash at 1/125 s+ on the AE-1 (above sync)."]},overcast:{id:"overcast",label:"Overcast",short:"Cloudy, soft",subjectEv:12,backgroundEv:12.5,evRange:[11,13],kelvin:"≈6500 K (cool)",outdoors:!0,flashRole:"optional",meaning:"Soft, even light about 3 stops darker than sun. Flattering, low contrast.",flashAdvice:"Usually no flash is needed. A weak fill (−1.5 to −2 stops) adds sparkle to eyes and separates the subject from a flat background.",balance:"Expose for the subject; a fill flash should be barely noticeable.",mistakes:["Including a white sky in the frame makes the camera underexpose the subject.","Flat, low-contrast results; look for directional light near the edge of shade."]},golden:{id:"golden",label:"Golden hour",short:"Low warm sun",subjectEv:12,backgroundEv:13,evRange:[10,13],kelvin:"≈3000–4000 K (warm)",outdoors:!0,flashRole:"fill",meaning:"Warm, low-angle light; brightness changes quickly. Shadows are long and soft-edged.",flashAdvice:"Fill flash keeps a backlit or side-lit face from going dark while the warm background glows. The flash is cooler than the sunset, and some photographers add a CTO (orange) gel to match.",balance:"Expose for the warm sky or rim light, then add flash at −1 to −1.5 stops on the face.",mistakes:["Metering late in the hour with an old reading. Light drops a stop every few minutes near sunset.","Overpowering the sunset with too much flash."]},blue:{id:"blue",label:"Blue hour",short:"After sunset",subjectEv:8,backgroundEv:9,evRange:[6,10],kelvin:"≈9000 K+ (very blue)",outdoors:!0,flashRole:"key",meaning:"Dim, blue, even light; city lights balance with the sky for a short window.",flashAdvice:"The flash becomes the main light on a near subject while a slow shutter records the blue sky.",balance:"Choose the shutter for the sky (1–2 stops under for deep blue). The flash power sets the subject.",mistakes:["Handholding slow sky exposures. Brace or use a tripod.","A fast sh  root of power: 1/4 power halves it.","Required power = (aperture × distance ÷ GN)². Every stop of loss from a diffuser or bounce doubles the power needed.","Manufacturer ratings are often optimistic. An independent test of the iT32 measured about GN 11.5 against Godox's 18 (metre figures; 38 vs 59 in feet), a difference of about 1.3 stops. Calibrate your own unit."]},{id:"inverse-square",title:"Inverse-square falloff",when:{flash:!0},body:["Light from a small source spreads out: at twice the distance it covers four times the area, so it is two stops dimmer.","This is why direct flash makes black backgrounds: a wall 4 m behind a subject at 2 m gets (2/6)² = 1/9 of the light, about 3.2 stops less.","Move the subject away from the background for a darker background; move the flash closer to the subject for faster falloff across the frame."]},{id:"sync",title:"Flash sync speed",when:{flash:!0},body:["A focal-plane shutter is two curtains. At fast speeds the second curtain starts closing before the first has fully opened, so only a moving slit exposes the film. A flash fired then lights only that slit.","The AE-1 Program's fastest full-open speed for flash is 1/60 s. Faster and part of the frame stays black. With the iT32 it will not set this for you.","The X-T5 syncs at 1/250 s with the mechanical shutter. Above that, high-speed sync (HSS) pulses the flash, at a large cost in output."]},{id:"balance",title:"Balancing ambient light and flash",when:{flash:!0,lighting:["night","blue","indoor","lowlight","mixed"]},body:["Decide how bright the background should be relative to the subject. Natural: 0 to −1 stop. Moody: −1.5 to −2. The 90s snapshot look: −3 or darker.","Slow sync (dragging the shutter) lets more ambient in. With subject movement, ambient light records a soft ghost around the flash-frozen image.","Keep ambient on the subject at least 1.5–2 stops under the flash if you want sharp results at slow shutter speeds."]},{id:"fill",title:"Fill flash ratios",when:{flash:!0,lighting:["sunny","golden","backlit","overcast"]},body:["Fill flash adds light to shadows without becoming the main light. −2 stops is subtle, −1 is clearly visible, 0 makes flash the dominant look.","In bright light the sync speed limits you: on the AE-1 at 1/60 s, ISO 100 film already needs f/16–f/22 in sun, which limits the iT32 to about 1 m of fill.","Often a reflector or turning the subject to put the sun behind them is a better fill than a small flash."]},{id:"soft",title:"Hard light, soft light, bounce and diffusion",when:{flash:!0},body:["Softness comes from the size of the light relative to the subject, not from the modifier's name. A bare iT32 head is tiny, so it gives hard light with crisp shadows.","Bouncing off a ceiling or wall turns a large area into the light source. That gives much softer light, but it costs the extra path length plus 1–2 stops of surface loss.","A clip-on diffuser costs about a stop and softens only slightly outdoors (no walls to bounce from). Indoors it spreads light to nearby surfaces.","Coloured surfaces tint the bounce. A green wall gives green light."]},{id:"offcamera",title:"Off-camera direction",when:{flash:!0,subjects:["portrait","fashion","product","food"]},body:["45° to the side and slightly above (Rembrandt-style) gives shape with a small triangle of light on the far cheek.","90° to the side (split light) lights half the face: dramatic, high contrast.","Behind the subject (rim) outlines hair and shoulders and separates them from a dark background.","Only the flash-to-subject distance matters for exposure. Where the camera stands does not."]},{id:"film-types",title:"Colour negative, slide and B&W film",when:{film:!0},body:["Colour negative (C-41) has wide latitude and tolerates overexposure far better than underexposure. Most stocks look good from about −1 to +2 or more stops; how much varies by stock.","Slide film (E-6) gives a positive image with narrow latitude: about ±⅓ stop for critical work. Meter for the highlights.","B&W negative is developed to taste: expose for the shadows, and development controls the highlights and contrast.","Chromogenic B&W (XP2 Super) is processed in C-41 and behaves like colour negative."]},{id:"latitude",title:"Exposure latitude, over- and underexposure",when:{film:!0},body:["Latitude is how far from correct you can expose and still get a usable image. It differs by stock, processing, scanning and taste.",'There is no universal rule like "always overexpose negative film by one stop". Some stocks (Portra 400) look great with generous exposure; others (Ektar) are less forgiving; slide film does not tolerate it at all.',"Underexposed colour negative gets grainy, muddy and colour-shifted shadows. Overexposed negatives get denser and lower in contrast, and eventually lose highlight separation."]},{id:"push-pull",title:"Push and pull processing vs. the ISO dial",when:{film:!0,lighting:["night","lowlight","verydark","indoor"]},body:["Changing the AE-1's film-speed dial only changes how the meter calculates. It does not change the film.","Pushing means rating the film faster (e.g. Tri-X at 1600) and telling the lab to develop longer to compensate. The whole roll must be shot at that rating.","Pulling is the reverse: rate slower, develop shorter, for lower contrast.","Pushing adds contrast and grain, and does not create real shadow detail. B&W 400 films push well; colour negative pushes 1–2 stops with colour shifts; many slide films push less well."]},{id:"grain",title:"Grain",when:{film:!0},body:["Faster films use larger silver halide crystals, so they show more grain. Underexposure and pushing make grain more visible.","Colour negative usually shows less grain with more exposure. Scanning sharpness settings can exaggerate it."]},{id:"colour-temp",title:"Colour temperature",when:{lighting:["golden","blue","indoor","night","mixed","lowlight"]},body:["Daylight and flash are about 5500–6000 K. Household lamps are about 2700–3200 K: much warmer. Shade and blue hour are 7000–10000 K: cooler.","Daylight film renders tungsten light orange. Tungsten film (500T, 800T) renders it neutral but renders daylight and flash blue.","A CTO (orange) gel on the flash matches it to warm room light, so the subject and the room are the same colour."]},{id:"reciprocity",title:"Reciprocity failure",when:{film:!0,lighting:["blue","night","verydark","lowlight"]},body:["At exposures longer than about 1 s, most films respond less than the meter expects, so they need extra time.","Harman (Ilford) publishes a formula: corrected time = metered time ^ p (1.31 for HP5 Plus). Kodak publishes tables. Fujifilm Provia 100F and Acros II need no correction for very long times.","Digital sensors do not have reciprocity failure."]},{id:"dof",title:"Depth of field and focus",body:["Depth of field grows with smaller apertures, shorter focal lengths and greater distance.","Hyperfocal focusing: focus at the hyperfocal distance and everything from half that distance to infinity is acceptably sharp. At 35mm f/8 on film it is about 5 m.","Zone focus for street: pre-set 2.5–3 m at f/8 and you are sharp from roughly 1.7 m to 6 m without touching the ring.","On the AE-1 Program's split-image screen, focus on an edge or the iris of an eye until the two halves line up."]},{id:"metering",title:"Metering with the AE-1 Program",when:{film:!0},body:["The AE-1 Program meters centre-weighted average: the centre of the frame counts most.","Bright skies or windows in the frame make it underexpose the subject. Meter a mid-tone (skin in shade, grass, jeans) and set it manually.","With manual flash, the meter reads only the ambient light. Use it to judge the background exposure at your chosen shutter speed."]}],qb=[{term:"EV (exposure value)",def:"A number for scene brightness or exposure settings. +1 EV = twice the light. Sun ≈ EV 15, a lit room ≈ EV 6 (at ISO 100)."},{term:"Stop",def:"A doubling or halving of light. f/4 → f/5.6, 1/60 → 1/125, ISO 200 → 400, 1/4 → 1/8 power are each one stop."},{term:"Guide number (GN)",def:"Flash output as aperture × distance at full power and a stated ISO. iT32: 18 m at ISO 100 (rated)."},{term:"Sync speed",def:"Fastest shutter at which the whole frame is open when the flash fires. AE-1 Program 1/60 s, X-T5 1/250 s."},{term:"TTL",def:"Through-the-lens flash metering. Needs a camera and trigger that talk to each other. Not possible on the AE-1 Program."},{term:"HSS",def:"High-speed sync: the flash pulses to work above sync speed, losing a lot of power."},{term:"Key light",def:"The main light that sets the subject's exposure."},{term:"Fill light",def:"A weaker light that lifts shadows without setting the exposure."},{term:"Slow sync / dragging the shutter",def:"A slow shutter with flash, so the ambient background records too."},{term:"Rear-curtain sync",def:"Fires the flash at the end of the exposure so motion trails follow the subject. Available on the X-T5, not the AE-1."},{term:"Ghosting",def:"A soft, blurred image from ambient light around the sharp flash-frozen subject during slow sync."},{term:"Inverse-square law",def:"Light intensity falls with the square of distance: double the distance, a quarter of the light."},{term:"Bounce",def:"Pointing the flash at a surface so the surface becomes a larger, softer light source."},{term:"Latitude",def:"How far from correct a film can be exposed and still give a usable image."},{term:"EI (exposure index)",def:"The speed you actually rate a film at, which may differ from the box ISO."},{term:"Push / pull",def:"Rating film faster/slower and developing longer/shorter to compensate."},{term:"Reciprocity failure",def:"Film losing sensitivity at long (or very short) exposures."},{term:"Depth of field",def:"The distance range that looks acceptably sharp."},{term:"Hyperfocal distance",def:"Focus distance that gives sharpness from half that distance to infinity."},{term:"Circle of confusion",def:"The blur size still accepted as sharp. 0.03 mm for 35mm film, 0.02 mm for APS-C."},{term:"Zone focusing",def:"Pre-setting focus so a range of distances is sharp without refocusing."},{term:"Crop factor",def:"APS-C (X-T5) is 1.5×: a 35mm lens frames like a 52mm lens on 35mm film."},{term:"C-41 / E-6 / ECN-2",def:"Development processes: colour negative / slide / motion-picture negative."},{term:"Rem-jet",def:"Black anti-halation backing on cinema film; must be removed in ECN-2 processing."},{term:"Halation",def:"Red glow around bright lights on film without anti-halation layers (e.g. CineStill)."},{term:"Orthochromatic",def:"Film that does not see red light. Red renders dark."},{term:"Colour temperature",def:"Colour of light in kelvin. Low = warm (tungsten ≈ 3200 K), high = cool (shade ≈ 7500 K)."},{term:"CTO gel",def:"Orange filter for the flash that matches it to tungsten light."}],Hb=[{title:"Calibrate your iT32 guide number",steps:["ISO 100 film (or the X-T5 at ISO 100, manual flash). Subject: a grey card or face at exactly 2 m, in a room with dim ambient.","Shutter 1/60 s, flash direct at 1/1 power.","Shoot f/5.6, f/8, f/11 and f/16, noting each frame.","Pick the best-exposed frame: your GN = that aperture × 2. Enter it under Guide number → My value."]},{title:"Drag the shutter",steps:["Indoor or night scene, flash direct, power fixed.","Shoot the same frame at 1/60, 1/30, 1/15 and 1/8 s.","The subject should stay the same while the background brightens a stop each time."]},{title:"See inverse-square falloff",steps:["Fix power and aperture. Put people at 1 m, 2 m and 4 m from the flash.","Each doubling of distance should be two stops darker."]},{title:"Direct vs bounce vs off-camera",steps:["Same subject, same position. Shoot direct, bounced off the ceiling, and off-camera at 45°.","Use the app for each power. Compare shadows and skin texture."]},{title:"Find your film's latitude",steps:["On one roll of colour negative, shoot a scene at −2, −1, 0, +1, +2 and +3 stops.","Note which frames you prefer. That is your personal exposure rating for this stock and lab."]}],Gb=[{q:"With the flash as the main light, you change the shutter from 1/60 to 1/15 s. What happens?",options:["Subject and background both get 2 stops brighter","Background gets ~2 stops brighter; subject stays about the same","Nothing changes","Subject gets brighter, background stays the same"],answer:1,explain:"At normal sync, shutter speed only changes the ambient part of the exposure."},{q:"Your subject moves from 2 m to 4 m. How much more flash power do you need?",options:["1 stop (×2)","2 stops (×4)","4 stops","None"],answer:1,explain:"Inverse-square law: double the distance gives a quarter of the light."},{q:"GN 18 at ISO 100. What is it at ISO 400?",options:["72","36","25.5","18"],answer:1,explain:"GN scales with √(ISO ratio): √4 = 2, so 36."},{q:"You want flash fill in bright sun on the AE-1 Program with ISO 400 film. What is the problem?",options:["No problem","At 1/60 s even f/22 overexposes the ambient","The flash is too strong","TTL will fail"],answer:1,explain:"Sunny 16 at ISO 400 at 1/60 s needs about f/45. Use ISO 100 film or an ND filter (which also cuts the flash)."},{q:"Which film gives you the least room for exposure error?",options:["Portra 400","HP5 Plus","Velvia 50","XP2 Super"],answer:2,explain:"Slide film (Velvia) has narrow latitude, about ±⅓ stop for critical work."},{q:"You set the AE-1's film-speed dial to 1600 with Tri-X loaded but tell the lab nothing. Result?",options:["A pushed roll","Two stops underexposed negatives, developed normally","No difference","Overexposed negatives"],answer:1,explain:"The dial only changes metering. Pushing needs longer development too."},{q:"Bouncing off a white ceiling instead of firing direct usually needs…",options:["Less power","The same power","More power: longer path plus surface loss","A faster shutter"],answer:2,explain:"The light travels further and the ceiling absorbs and scatters some of it."}];function Lb(i,r){return i.when?!!(i.when.subjects&&r.subject&&i.when
